# Daily forecast run. This file is inert while jellyfish_beta lives inside
# another repository; move it to .github/workflows/ at the root when the
# folder becomes its own repo.
name: daily-forecast
on:
  schedule:
    - cron: "0 3 * * *"   # 07:00 Mauritius time
  workflow_dispatch:
jobs:
  forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/run_forecast.py --days 7
      - name: Commit latest risk table
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add -f data/outputs/latest_risk.csv
          git commit -m "Daily forecast $(date -u +%Y-%m-%d)" || echo "no change"
          git push
