# Target beaches / lagoon segments for the Mauritius jellyfish beta.
#
# facing_deg : compass bearing (degrees, 0 = N, 90 = E) pointing from the beach
#              OUT TO SEA (shore-normal). Wind or swell arriving FROM this
#              bearing is fully onshore. These are approximate, read off the
#              coastline orientation, and should be verified in QGIS or on the
#              ground before the numbers are trusted.
# lagoon     : true if the beach sits inside a fringing reef lagoon.
# region     : coarse grouping used for reporting only.
