# Keywords that, if present, should suppress a match regardless of score
# (e.g. adjacent sectors you've decided are not relevant).
exclude_keywords: []

# Minimum combined score (0-1) required to appear in the table by default.
# The Streamlit UI lets you lower/raise this per session without editing
# this file.
min_match_score: 0.25

# If true, the sweep only writes opportunities not already stored (by URL);
# already-seen items are updated in place but not re-flagged as "new".
notify_new_only: true
