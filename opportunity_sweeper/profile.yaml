# Eligibility profile for the opportunity sweeper.
#
# Built from: CV_Bacha_Gian_Suraj_merged.pdf, EMCL_Activity_Report_2025_2026.pdf,
# and CORAL_GARDEN_CONSERVATION.pdf (organisation profile), supplied 2026-09-16.
#
# How matching works (see matcher.py): each opportunity's title+description
# is checked against every persona's keywords, geography, opportunity_types
# and trusted_funders. A trusted_funders hit is the strongest signal (these
# are named organisations that already fund/employ this persona) and is
# weighted highest. An opportunity can match more than one persona — e.g. a
# CEPF coral-reef grant would match both "company" and "ngo".

